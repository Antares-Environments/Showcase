<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe57f" />
      <stop offset="30%" stop-color="#ffb300" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffe57f" />
      <stop offset="100%" stop-color="#ff8f00" />
    </linearGradient>

    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#89e65b" />
      <stop offset="100%" stop-color="#4e9933" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="270" r="230" fill="#ff8f00" opacity="0.15" filter="blur(10px)" />

  <circle cx="256" cy="256" r="230" fill="url(#coinGrad)" stroke="url(#rimGrad)" stroke-width="15" />

  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffe57f" stroke-width="6" stroke-dasharray="16 12" opacity="0.85" />

  <circle cx="256" cy="256" r="170" fill="#ffb300" opacity="0.3" stroke="#ffe57f" stroke-width="3" />

  <g transform="translate(256, 256)">
    <rect x="-14" y="-150" width="28" height="300" rx="10" fill="url(#dollarGrad)" />
    <path d="M 75 -70
             C 75 -125, -75 -125, -75 -65
             C -75 -15, 75 -35, 75 25
             C 75 85, -75 85, -75 30" 
          fill="none" 
          stroke="url(#dollarGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
